name: Atlas conversion baseline
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML
      - run: npm run check
      - name: Validate and regenerate the Atlas baseline
        run: bash scripts/test-convert-outputs.sh --update
      - name: Verify the regenerated baseline
        run: bash scripts/test-convert-outputs.sh
      - name: Commit only the validated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/convert-outputs.sha256
          if ! git diff --cached --quiet; then
            git commit -m "fix(workforce): regenerate validated Atlas conversion baseline"
            git push origin HEAD:main
          fi
